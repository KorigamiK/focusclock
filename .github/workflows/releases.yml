name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:rolling
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "Creating manual release for v${{ github.event.inputs.version }}"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "Creating release from tag ${GITHUB_REF#refs/tags/}"
          fi

      - name: Update CMakeLists.txt version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/project(focusclock VERSION [0-9.]*)/project(focusclock VERSION ${VERSION})/" CMakeLists.txt

      - name: Extract changelog
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          VERSION_NUM=${VERSION#v}
          sed -n "/## \[$VERSION_NUM\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md

      - name: Install dependencies
        run: |
          apt-get --assume-yes update
          apt-get --assume-yes install build-essential cmake pkg-config \
            wayland-protocols \
            libgtkmm-4.0-dev libgtk4-layer-shell-dev

      # Relative paths: inside the container ${{ github.workspace }} expands
      # to the host path, not the container's /__w/... workspace.
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: |
          DESTDIR=$PWD/package cmake --install build

      - name: Package
        run: |
          cd package
          tar -czvf ../focusclock-linux-x86_64.tar.gz ./*

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusclock-linux
          path: focusclock-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    needs: build-linux
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            zip
          update: true

      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "Preparing manual build for v${{ github.event.inputs.version }}"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "Preparing build from tag ${GITHUB_REF#refs/tags/}"
          fi

      - name: Update CMakeLists.txt version
        if: github.event_name == 'workflow_dispatch'
        shell: msys2 {0}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s/project(focusclock VERSION [0-9.]*)/project(focusclock VERSION ${VERSION})/" CMakeLists.txt

      - name: Configure CMake (UCRT64)
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DFOCUSCLOCK_ENABLE_LAYER_SHELL=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build (UCRT64)
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Stage Windows artifacts
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/focusclock.exe dist/
          cp README.md dist/
          cp LICENSE dist/

      - name: Package Windows archive
        shell: msys2 {0}
        run: |
          cd dist
          zip -r ../focusclock-windows-x86_64.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusclock-windows
          path: focusclock-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CMakeLists.txt version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i '' "s/project(focusclock VERSION [0-9.]*)/project(focusclock VERSION ${VERSION})/" CMakeLists.txt

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release

      - name: Package universal binary
        run: |
          lipo -info build/focusclock
          ./build/focusclock --version
          mkdir -p dist
          cp build/focusclock README.md LICENSE dist/
          tar -czvf focusclock-macos-universal.tar.gz -C dist .
          shasum -a 256 focusclock-macos-universal.tar.gz

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusclock-macos
          path: focusclock-macos-universal.tar.gz
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-macos
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: focusclock-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: focusclock-windows
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: focusclock-macos
          path: artifacts

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/focusclock-linux-x86_64.tar.gz
            artifacts/focusclock-windows-x86_64.zip
            artifacts/focusclock-macos-universal.tar.gz
          body_path: release_notes.md
          generate_release_notes: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          draft: false
          tag_name: ${{ needs.build-linux.outputs.version }}

  update-homebrew:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - create-release
    if: ${{ !(github.event.inputs.prerelease == 'true') }}
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check tap token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update"
            echo "present=false" >> $GITHUB_OUTPUT
          else
            echo "present=true" >> $GITHUB_OUTPUT
          fi

      - name: Check out tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: KorigamiK/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write formula
        if: steps.token.outputs.present == 'true'
        run: |
          TAG="${{ needs.build-linux.outputs.version }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA256=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          mkdir -p tap/Formula
          cat > tap/Formula/focusclock.rb <<EOF
          class Focusclock < Formula
            desc "Big clock that floats above all windows to help you focus"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "${URL}"
            sha256 "${SHA256}"
            license "GPL-3.0-or-later"
            head "https://github.com/${GITHUB_REPOSITORY}.git", branch: "main"

            depends_on "cmake" => :build
            depends_on :macos

            def install
              system "cmake", "-S", ".", "-B", "build", *std_cmake_args
              system "cmake", "--build", "build"
              system "cmake", "--install", "build"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/focusclock --version")
            end
          end
          EOF
          cat tap/Formula/focusclock.rb

      - name: Push formula
        if: steps.token.outputs.present == 'true'
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/focusclock.rb
          git diff --cached --quiet && exit 0
          git commit -m "focusclock ${{ needs.build-linux.outputs.version }}"
          git push
