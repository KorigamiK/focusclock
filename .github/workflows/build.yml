name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:rolling
            deps: |
              apt-get --assume-yes update
              apt-get --assume-yes install build-essential cmake pkg-config \
                libwayland-dev wayland-protocols libcairo2-dev
          # Same packages as the AUR PKGBUILD's depends/makedepends.
          - image: archlinux:latest
            deps: |
              pacman -Syu --noconfirm --needed base-devel cmake \
                wayland wayland-protocols cairo
    container:
      image: ${{ matrix.image }}
    name: linux (${{ matrix.image }})
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.deps }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build

      - name: Smoke test
        run: |
          ./build/focusclock --version
          ./build/focusclock --help
          # No compositor in CI: it must fail cleanly, not crash.
          if WAYLAND_DISPLAY=none ./build/focusclock; then exit 1; fi

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
            -DCMAKE_OBJCXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build

      - name: Smoke test
        run: |
          lipo -info build/focusclock
          ./build/focusclock --version
          ./build/focusclock --help
